name: Update Feed

on:
  schedule:
    # Magyar nyári idő szerint kb. 12:17
    # GitHub cron UTC-ben működik.
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Random késleltetés schedule futásnál
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 900))

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python csomagok telepítése
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Feed generálása UNAS-ból
        env:
          UNAS_API_KEY: ${{ secrets.UNAS_API_KEY }}
          OUTPUT_DIR: public
          GOOGLE_STORE_CODE: ${{ secrets.GOOGLE_STORE_CODE }}
          MULTIPLY_BY_MIN_QTY: "false"
          WRITE_DEBUG_XLSX: "false"
        run: |
          python unas_inventory_program.py

      - name: Egyszerű index.html létrehozása
        run: |
          echo '<!doctype html><html><head><meta charset="utf-8"><title>UNAS Merchant Feed</title></head><body><h1>UNAS Merchant Feed</h1><p><a href="product_database_raw.txt">product_database_raw.txt</a></p></body></html>' > public/index.html

      - name: Pages artifact feltöltése
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages-re
        id: deployment
        uses: actions/deploy-pages@v4
