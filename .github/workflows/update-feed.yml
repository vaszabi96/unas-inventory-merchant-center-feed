name: Generate UNAS Merchant Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '10 6 * * *'
      timezone: 'Europe/Budapest'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: merchant-feed-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python csomagok telepítése
        run: pip install -r requirements.txt

      - name: Feed generálása UNAS-ból
        env:
          UNAS_API_KEY: ${{ secrets.UNAS_API_KEY }}
          OUTPUT_DIR: public
        run: python unas_inventory_program.py

      - name: Egyszerű index.html létrehozása
        run: |
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="hu">
          <head>
            <meta charset="utf-8">
            <title>UNAS Merchant feed</title>
          </head>
          <body>
            <h1>UNAS Merchant feed</h1>
            <p><a href="./product_database_raw.txt">product_database_raw.txt</a></p>
          </body>
          </html>
          HTML

      - name: GitHub Pages artifact feltöltése
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publikálás GitHub Pages-re
        id: deployment
        uses: actions/deploy-pages@v4
