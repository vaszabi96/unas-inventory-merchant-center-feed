name: Update Feed

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Random késleltetés
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 900))

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run feed generator
        env:
          UNAS_API_KEY: ${{ secrets.UNAS_API_KEY }}
        run: |
          for i in 1 2 3; do
            echo "Próbálkozás: $i"
            python unas_inventory_program.py && exit 0

            echo "Sikertelen futás, várakozás 10 perc..."
            sleep 600
          done

          exit 1

      - name: Commit feed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add public/
          git diff --staged --quiet || git commit -m "Update feed"
          git push
