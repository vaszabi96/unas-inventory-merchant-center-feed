name: Update Feed

on:
  schedule:
    # Magyar nyári idő szerint kb. 12:17
    # GitHub cron UTC-ben működik.
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  attempt_1:
    name: UNAS kísérlet 1/3
    uses: ./.github/workflows/feed-attempt.yml
    with:
      artifact_name: feed-attempt-1
    secrets:
      UNAS_API_KEY: ${{ secrets.UNAS_API_KEY }}
      GOOGLE_STORE_CODE: ${{ secrets.GOOGLE_STORE_CODE }}

  attempt_2:
    name: UNAS kísérlet 2/3, új runner IP
    needs: attempt_1
    if: ${{ always() && needs.attempt_1.result == 'failure' }}
    uses: ./.github/workflows/feed-attempt.yml
    with:
      artifact_name: feed-attempt-2
    secrets:
      UNAS_API_KEY: ${{ secrets.UNAS_API_KEY }}
      GOOGLE_STORE_CODE: ${{ secrets.GOOGLE_STORE_CODE }}

  attempt_3:
    name: UNAS kísérlet 3/3, új runner IP
    needs: attempt_2
    if: ${{ always() && needs.attempt_2.result == 'failure' }}
    uses: ./.github/workflows/feed-attempt.yml
    with:
      artifact_name: feed-attempt-3
    secrets:
      UNAS_API_KEY: ${{ secrets.UNAS_API_KEY }}
      GOOGLE_STORE_CODE: ${{ secrets.GOOGLE_STORE_CODE }}

  package:
    name: Sikeres feed előkészítése
    needs: [attempt_1, attempt_2, attempt_3]
    if: >-
      ${{ always() && (
        needs.attempt_1.result == 'success' ||
        needs.attempt_2.result == 'success' ||
        needs.attempt_3.result == 'success'
      ) }}
    runs-on: ubuntu-latest

    steps:
      - name: Első kísérlet feedjének letöltése
        if: ${{ needs.attempt_1.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: feed-attempt-1
          path: public

      - name: Második kísérlet feedjének letöltése
        if: ${{ needs.attempt_2.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: feed-attempt-2
          path: public

      - name: Harmadik kísérlet feedjének letöltése
        if: ${{ needs.attempt_3.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: feed-attempt-3
          path: public

      - name: Pages artifact feltöltése
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: package
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages-re
        id: deployment
        uses: actions/deploy-pages@v4
